name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Set up pinned Rust toolchain
        run: rustc --version
      - name: Install just
        run: brew install just
      - name: Check formatting, lint, and tests
        run: just check
