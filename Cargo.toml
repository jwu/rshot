[workspace]
members = ["crates/rshot-cli", "crates/rshot-core", "crates/rshot-gui"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
anyhow = "1"
block2 = "0.6"
clap = { version = "4", features = ["derive"] }
futures-channel = "0.3"
gpui = { version = "0.2.2", default-features = false, features = ["runtime_shaders"] }
image = { version = "0.25", default-features = false, features = ["png"] }
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std"] }
objc2-core-foundation = "0.3"
objc2-core-graphics = "0.3"
objc2-foundation = "0.3"
objc2-screen-capture-kit = "0.3"
raw-window-handle = "0.6"
rshot-core = { path = "crates/rshot-core" }
thiserror = "2"

[workspace.lints.clippy]
dbg_macro = "warn"

[profile.dev]
debug = "line-tables-only"
