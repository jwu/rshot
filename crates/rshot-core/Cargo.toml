[package]
name = "rshot-core"
version.workspace = true
edition.workspace = true

[dependencies]
caseless = "0.2"
image.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_path_to_error = "0.1"
thiserror.workspace = true
tiny-skia = { version = "0.11", default-features = false, features = ["std"] }

[target.'cfg(target_os = "macos")'.dependencies]
block2.workspace = true
objc2.workspace = true
objc2-app-kit = { workspace = true, features = ["objc2-core-foundation", "objc2-core-graphics", "NSAttributedString", "NSColor", "NSFont", "NSGraphicsContext", "NSStringDrawing"] }
objc2-core-foundation.workspace = true
objc2-core-graphics.workspace = true
objc2-foundation.workspace = true
objc2-screen-capture-kit.workspace = true
objc2-vision = { version = "0.3", default-features = false, features = ["std", "VNObservation", "VNRecognizeTextRequest", "VNRequest", "VNRequestHandler", "VNTypes", "objc2-core-foundation", "objc2-core-graphics"] }

[lints]
workspace = true
